name: Keep-Alive 24/7 Ping

on:
  schedule:
    # Run every 24 hours at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Cloud App to Prevent Sleep
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://freshflow-agentic-bi.streamlit.app/
